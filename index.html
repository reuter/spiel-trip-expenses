<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Expenses</title>
<meta name="theme-color" content="#2563eb">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e2e5ea; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f26; --text:#eceff4; --muted:#9aa3b0; --line:#2b313b; --accent:#5b8def; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  .balance { font-size:24px; font-weight:650; margin:4px 0; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .go { width:100%; margin-top:16px; padding:14px; font-size:17px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  .go:disabled { opacity:.6; }
  #msg { margin-top:10px; font-size:14px; min-height:18px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .item { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .item small { color:var(--muted); display:block; }
  .amt { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .del { background:none; border:0; color:var(--muted); font-size:13px; padding:2px 0 0; text-decoration:underline; }
  .gate input { margin-top:8px; }

  .col { display:flex; flex-direction:column; gap:14px; }
  body.wide .wrap { max-width:1100px; }
  .tools { display:flex; gap:8px; margin-bottom:10px; }
  .mini { padding:0 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font-size:14px; white-space:nowrap; }
  .tscroll { overflow-x:auto; }
  #tbl { border-collapse:collapse; min-width:960px; width:100%; }
  #tbl th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:6px 4px; white-space:nowrap; }
  #tbl th[data-sort] { cursor:pointer; user-select:none; }
  #tbl td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:middle; }
  #tbl input, #tbl select { padding:8px; font-size:15px; border-radius:8px; }
  #tbl tr.filters th { padding:4px; }
  #tbl tr.bad td { background:rgba(185,28,28,.09); }
  #tbl input:disabled { opacity:.45; }
  .cad { font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; display:inline-block; }
  .st { display:block; font-size:12px; max-width:150px; }
  .st.muted { color:var(--muted); }
  .xdel { background:none; border:0; color:var(--muted); font-size:18px; padding:4px 8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card gate" id="gate" style="display:none">
    <h1>Trip expenses</h1>
    <div class="muted">Enter the access key you were given (or open the full shared link).</div>
    <input id="keyIn" placeholder="Access key" autocomplete="off" autocapitalize="off">
    <button class="go" id="keyGo">Open</button>
  </div>

  <div id="app" style="display:none">
    <div class="wrap">
      <div class="card">
        <h1>Trip expenses</h1>
        <div class="muted">Running balance (all in CAD)</div>
        <div class="balance" id="balance">Loading…</div>
        <div class="muted" id="totals"></div>
      </div>

      <div class="seg" id="tabs">
        <button type="button" data-v="add" class="on">Add &amp; recent</button>
        <button type="button" data-v="table">Table</button>
      </div>

      <div class="col" id="viewAdd">
      <div class="card">
        <label style="margin-top:0">Paid by</label>
        <div class="seg" id="payer">
          <button type="button" data-v="Andy">Andy</button>
          <button type="button" data-v="Jay">Jay</button>
        </div>

        <label for="desc">What was it?</label>
        <input id="desc" placeholder="e.g. Dinner in Cologne" autocomplete="off">

        <label>Currency</label>
        <div class="seg" id="cur">
          <button type="button" data-v="CAD" class="on">CAD</button>
          <button type="button" data-v="EUR">EUR</button>
        </div>

        <div class="row">
          <div>
            <label for="amount">Amount</label>
            <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
          </div>
          <div id="rateBox" style="display:none">
            <label for="rate">EUR → CAD rate</label>
            <input id="rate" type="number" inputmode="decimal" step="0.0001" min="0">
          </div>
        </div>
        <div class="muted" id="preview" style="margin-top:6px"></div>

        <div class="row">
          <div>
            <label for="date">Date</label>
            <input id="date" type="date">
          </div>
          <div>
            <label for="split">Split</label>
            <select id="split">
              <option value="even">50/50</option>
              <option value="Andy">Only Andy's</option>
              <option value="Jay">Only Jay's</option>
            </select>
          </div>
        </div>

        <button class="go" id="save">Add expense</button>
        <button class="go" id="cancel" style="display:none;background:var(--bg);color:var(--text);border:1px solid var(--line);margin-top:8px">Cancel editing</button>
        <div id="msg"></div>
      </div>

      <div class="card">
        <div class="muted" style="margin-bottom:4px">All entries (<span id="count">0</span>)</div>
        <div id="list"></div>
      </div>
      </div>

      <div class="card" id="viewTable" style="display:none">
        <div class="tools">
          <input id="fq" type="search" placeholder="Search all columns…" autocomplete="off">
          <button type="button" id="fclear" class="mini">Clear filters</button>
        </div>
        <div class="tscroll">
          <table id="tbl">
            <thead>
              <tr>
                <th data-sort="spent_on" style="min-width:150px">Date <span class="ar"></span></th>
                <th data-sort="description" style="min-width:210px">Description <span class="ar"></span></th>
                <th data-sort="payer" style="min-width:95px">Paid by <span class="ar"></span></th>
                <th data-sort="split" style="min-width:135px">For <span class="ar"></span></th>
                <th data-sort="currency" style="min-width:85px">Cur <span class="ar"></span></th>
                <th data-sort="amount" style="min-width:100px">Amount <span class="ar"></span></th>
                <th data-sort="rate" style="min-width:95px">Rate <span class="ar"></span></th>
                <th data-sort="amount_cad" style="min-width:90px">CAD <span class="ar"></span></th>
                <th style="min-width:80px"></th>
              </tr>
              <tr class="filters">
                <th><input id="fdate" placeholder="Filter…" autocomplete="off"></th>
                <th><input id="fdesc" placeholder="Filter…" autocomplete="off"></th>
                <th><select id="fpayer"><option value="">All</option><option value="Andy">Andy</option><option value="Jay">Jay</option></select></th>
                <th><select id="fsplit"><option value="">All</option><option value="even">Both (50/50)</option><option value="Andy">Andy only</option><option value="Jay">Jay only</option></select></th>
                <th><select id="fcur"><option value="">All</option><option value="CAD">CAD</option><option value="EUR">EUR</option></select></th>
                <th></th><th></th><th></th><th></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="muted" id="tinfo" style="margin-top:8px"></div>
        <div class="muted">Edit any cell; it saves when you leave it. To add a new expense use the "Add &amp; recent" tab.</div>
      </div>
    </div>
  </div>

</div>

<script>
  var SUPABASE_URL = 'https://ywhwyjlbmiuvwtmudiuy.supabase.co';
  // Public anon key: safe to ship. Data is only reachable through RPCs that require the access key.
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aHd5amxibWl1dnd0bXVkaXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODk2MTYsImV4cCI6MjEwNzc2NTYxNn0.vAEbsyLMPwR59-FBGyCgz5Iw2xASSictp2phvrXJ2fk';
  var $ = function (id) { return document.getElementById(id); };
  var key = '', payer = null, currency = 'CAD', rows = [];

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function money(n) { return '$' + Number(n).toFixed(2); }
  function msg(t, c) { var m = $('msg'); m.textContent = t; m.className = c || ''; }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : '';
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function rpc(fn, args) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
      body: JSON.stringify(args)
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((j && j.message) || ('Request failed (' + r.status + ')'));
        return j;
      });
    });
  }

  function render(skipTable) {
    var paid = { Andy: 0, Jay: 0 }, share = { Andy: 0, Jay: 0 }, total = 0;
    rows.forEach(function (e) {
      var c = Number(e.amount_cad);
      total += c; paid[e.payer] += c;
      if (e.split === 'even') { share.Andy += c / 2; share.Jay += c / 2; } else { share[e.split] += c; }
    });
    var owed = Math.round((paid.Andy - share.Andy) * 100) / 100; // >0: Jay owes Andy
    $('balance').textContent = Math.abs(owed) < 0.005 ? 'All square'
      : owed > 0 ? 'Jay owes Andy ' + money(owed) : 'Andy owes Jay ' + money(-owed);
    $('totals').textContent = 'Total ' + money(total) + ' · Andy paid ' + money(paid.Andy) + ' · Jay paid ' + money(paid.Jay);

    $('count').textContent = rows.length;
    var l = $('list'); l.textContent = '';
    if (!rows.length) l.textContent = 'Nothing yet.';
    rows.forEach(function (e) {
      var row = document.createElement('div'); row.className = 'item';
      var left = document.createElement('div');
      left.appendChild(document.createTextNode(e.description));
      var sm = document.createElement('small');
      sm.textContent = e.payer + ' paid' + (e.spent_on ? ' · ' + fmtDate(e.spent_on) : '') + (e.split !== 'even' ? ' · only ' + e.split + "'s" : '');
      left.appendChild(sm);
      var edit = document.createElement('button'); edit.className = 'del'; edit.textContent = 'edit';
      edit.style.marginRight = '14px';
      edit.onclick = function () { startEdit(e); };
      left.appendChild(edit);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'delete';
      del.onclick = function () {
        if (!confirm('Delete "' + e.description + '"?')) return;
        rpc('trip_delete', { p: key, rid: e.id }).then(refresh).catch(function (err) { msg(err.message, 'err'); });
      };
      left.appendChild(del);
      var right = document.createElement('div'); right.className = 'amt';
      right.appendChild(document.createTextNode(money(e.amount_cad)));
      if (e.currency === 'EUR') {
        var s2 = document.createElement('small'); s2.textContent = '€' + Number(e.amount).toFixed(2) + ' @ ' + Number(e.rate).toFixed(4);
        right.appendChild(s2);
      }
      row.appendChild(left); row.appendChild(right); l.appendChild(row);
    });
    if (!skipTable && view === 'table') renderTable();
  }

  function refresh() {
    return rpc('trip_list', { p: key }).then(function (r) { rows = r || []; render(); }).catch(function (err) {
      if (/access key/i.test(err.message)) { store('key', ''); showGate('That key was not accepted.'); }
      else { $('balance').textContent = 'Could not load'; msg(err.message, 'err'); }
    });
  }

  function showGate(note) {
    $('app').style.display = 'none'; $('gate').style.display = '';
    if (note) $('keyIn').placeholder = note;
  }
  function start() {
    $('gate').style.display = 'none'; $('app').style.display = '';
    var sp = load('payer');
    if (sp === 'Andy' || sp === 'Jay') setPayer(sp);
    setView(view);
    refresh();
    fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=CAD').then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.rates && j.rates.CAD) liveRate = Number(j.rates.CAD); if (j && j.rates && j.rates.CAD && !$('rate').value) { $('rate').value = Number(j.rates.CAD).toFixed(4); updatePreview(); } })
      .catch(function () {});
  }

  function setPayer(p) {
    payer = p; store('payer', p);
    Array.prototype.forEach.call($('payer').children, function (c) { c.className = c.dataset.v === p ? 'on' : ''; });
  }
  Array.prototype.forEach.call($('payer').children, function (b) { b.onclick = function () { setPayer(b.dataset.v); }; });

  function updatePreview() {
    var a = parseFloat($('amount').value), rt = parseFloat($('rate').value);
    $('preview').textContent = (currency === 'EUR' && a > 0 && rt > 0) ? '≈ ' + money(a * rt) + ' CAD' : '';
  }
  Array.prototype.forEach.call($('cur').children, function (btn) {
    btn.onclick = function () {
      currency = btn.dataset.v;
      Array.prototype.forEach.call($('cur').children, function (c) { c.className = c === btn ? 'on' : ''; });
      $('rateBox').style.display = currency === 'EUR' ? '' : 'none';
      updatePreview();
    };
  });
  $('amount').oninput = updatePreview;
  $('rate').oninput = updatePreview;
  $('date').value = today();

  var editingId = null;
  function setCurrency(c) {
    currency = c;
    Array.prototype.forEach.call($('cur').children, function (b) { b.className = b.dataset.v === c ? 'on' : ''; });
    $('rateBox').style.display = c === 'EUR' ? '' : 'none';
    updatePreview();
  }
  function startEdit(e) {
    editingId = e.id;
    setPayer(e.payer);
    $('desc').value = e.description;
    setCurrency(e.currency);
    $('amount').value = Number(e.amount).toFixed(2);
    if (e.currency === 'EUR') $('rate').value = Number(e.rate).toFixed(4);
    $('date').value = e.spent_on || '';
    $('split').value = e.split;
    $('save').textContent = 'Save changes';
    $('cancel').style.display = '';
    msg('Editing "' + e.description + '"');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    updatePreview();
  }
  function endEdit() {
    editingId = null;
    $('save').textContent = 'Add expense';
    $('cancel').style.display = 'none';
    $('desc').value = ''; $('amount').value = ''; $('date').value = today(); $('split').value = 'even';
    setCurrency('CAD');
    updatePreview();
  }
  $('cancel').onclick = function () { endEdit(); msg(''); };

  $('save').onclick = function () {
    var desc = $('desc').value.trim(), amt = parseFloat($('amount').value), rt = parseFloat($('rate').value);
    if (!payer) return msg('Pick who paid.', 'err');
    if (!desc) return msg('Add a description.', 'err');
    if (!(amt > 0)) return msg('Enter an amount.', 'err');
    if (currency === 'EUR' && !(rt > 0)) return msg('Enter an exchange rate.', 'err');
    var btn = $('save'); btn.disabled = true; msg('Saving…');
    var editing = editingId;
    var args = {
      p: key, d: desc, who: payer, cur: currency, amt: amt,
      rt: currency === 'EUR' ? rt : 1, sp: $('split').value, dt: $('date').value || null
    };
    if (editing) args.rid = editing;
    rpc(editing ? 'trip_update' : 'trip_add', args).then(function () {
      btn.disabled = false;
      var done = editing ? 'Saved ✓' : 'Added ✓';
      if (editing) endEdit(); else { $('desc').value = ''; $('amount').value = ''; updatePreview(); }
      msg(done, 'ok'); setTimeout(function () { if ($('msg').textContent === done) msg(''); }, 3000);
      return refresh();
    }).catch(function (err) { btn.disabled = false; msg(err.message, 'err'); });
  };

  // ---------------- Table view: spreadsheet-style editing, filters, sorting ----------------
  var view = load('view') === 'table' ? 'table' : 'add';
  var liveRate = null;
  var flt = { q: '', date: '', desc: '', payer: '', split: '', cur: '' };
  var sortKey = 'spent_on', sortDir = -1;
  var SPLIT_LABEL = { even: 'Both (50/50)', Andy: 'Andy only', Jay: 'Jay only' };

  function setView(v) {
    view = v; store('view', v);
    $('viewAdd').style.display = v === 'add' ? '' : 'none';
    $('viewTable').style.display = v === 'table' ? '' : 'none';
    document.body.className = v === 'table' ? 'wide' : '';
    Array.prototype.forEach.call($('tabs').children, function (b) { b.className = b.dataset.v === v ? 'on' : ''; });
    if (v === 'table') renderTable();
  }
  Array.prototype.forEach.call($('tabs').children, function (b) { b.onclick = function () { setView(b.dataset.v); }; });

  function passes(e) {
    var dt = fmtDate(e.spent_on).toLowerCase();
    if (flt.q) {
      var hay = [e.description, e.payer, SPLIT_LABEL[e.split], e.currency, dt, e.spent_on || '', e.amount, e.amount_cad].join(' ').toLowerCase();
      if (!flt.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; })) return false;
    }
    if (flt.date && (dt + ' ' + (e.spent_on || '')).indexOf(flt.date) < 0) return false;
    if (flt.desc && e.description.toLowerCase().indexOf(flt.desc) < 0) return false;
    if (flt.payer && e.payer !== flt.payer) return false;
    if (flt.split && e.split !== flt.split) return false;
    if (flt.cur && e.currency !== flt.cur) return false;
    return true;
  }

  function sortVal(e, k) {
    if (k === 'spent_on') return e.spent_on || '';
    if (k === 'amount' || k === 'amount_cad' || k === 'rate') return Number(e[k]);
    return String(e[k] || '').toLowerCase();
  }
  function cmp(a, b) {
    var x = sortVal(a, sortKey), y = sortVal(b, sortKey);
    if (sortKey === 'spent_on') { if (!x && y) return 1; if (x && !y) return -1; } // undated always last
    var r = x < y ? -1 : x > y ? 1 : 0;
    if (r === 0) r = a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0;
    return r * sortDir;
  }

  function mk(tag, props, f) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { el[k] = props[k]; });
    if (f) el.dataset.f = f;
    return el;
  }
  function mkSelect(f, opts, val) {
    var s = mk('select', {}, f);
    opts.forEach(function (o) { var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; s.appendChild(op); });
    s.value = val; return s;
  }
  function cell(child) { var td = document.createElement('td'); td.appendChild(child); return td; }

  function renderTable() {
    var tb = $('tbody'); tb.textContent = '';
    rows.filter(passes).sort(cmp).forEach(function (e) {
      var tr = document.createElement('tr'); tr.dataset.id = e.id;
      tr.appendChild(cell(mk('input', { type: 'date', value: e.spent_on || '' }, 'spent_on')));
      tr.appendChild(cell(mk('input', { type: 'text', value: e.description, autocomplete: 'off' }, 'description')));
      tr.appendChild(cell(mkSelect('payer', [['Andy', 'Andy'], ['Jay', 'Jay']], e.payer)));
      tr.appendChild(cell(mkSelect('split', [['even', 'Both (50/50)'], ['Andy', 'Andy only'], ['Jay', 'Jay only']], e.split)));
      tr.appendChild(cell(mkSelect('currency', [['CAD', 'CAD'], ['EUR', 'EUR']], e.currency)));
      tr.appendChild(cell(mk('input', { type: 'number', step: '0.01', min: '0', inputMode: 'decimal', value: Number(e.amount).toFixed(2) }, 'amount')));
      var rate = mk('input', { type: 'number', step: '0.0001', min: '0', inputMode: 'decimal', placeholder: '—' }, 'rate');
      if (e.currency === 'EUR') rate.value = Number(e.rate).toFixed(4); else rate.disabled = true;
      tr.appendChild(cell(rate));
      tr.appendChild(cell(mk('span', { className: 'cad', textContent: money(e.amount_cad) })));
      var last = document.createElement('td');
      var del = mk('button', { type: 'button', className: 'xdel', textContent: '×', title: 'Delete this entry' });
      del.onclick = function () { deleteRow(e.id); };
      last.appendChild(del); last.appendChild(mk('span', { className: 'st' }));
      tr.appendChild(last);
      tb.appendChild(tr);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#tbl th[data-sort]'), function (th) {
      th.querySelector('.ar').textContent = th.dataset.sort === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
    });
    tableInfo();
  }

  function tableInfo() {
    var list = rows.filter(passes), tot = 0, pa = 0, pj = 0;
    list.forEach(function (e) { var c = Number(e.amount_cad); tot += c; if (e.payer === 'Andy') pa += c; else pj += c; });
    $('tinfo').textContent = 'Showing ' + list.length + ' of ' + rows.length + ' · Total ' + money(tot) +
      ' · Andy paid ' + money(pa) + ' · Jay paid ' + money(pj);
  }

  function field(tr, f) { return tr.querySelector('[data-f="' + f + '"]'); }
  function setStatus(tr, text, cls) {
    var s = tr.querySelector('.st'); s.textContent = text; s.className = 'st ' + (cls || '');
    tr.classList.toggle('bad', cls === 'err');
  }
  function previewRow(tr) {
    var a = parseFloat(field(tr, 'amount').value), cur = field(tr, 'currency').value;
    var rt = cur === 'EUR' ? parseFloat(field(tr, 'rate').value) : 1;
    tr.querySelector('.cad').textContent = (a > 0 && rt > 0) ? money(Math.round(a * rt * 100) / 100) : '—';
  }
  function commitRow(tr) {
    var e = rows.filter(function (x) { return x.id === tr.dataset.id; })[0]; if (!e) return;
    var v = {
      d: field(tr, 'description').value.trim(), who: field(tr, 'payer').value, cur: field(tr, 'currency').value,
      amt: parseFloat(field(tr, 'amount').value), rt: parseFloat(field(tr, 'rate').value),
      sp: field(tr, 'split').value, dt: field(tr, 'spent_on').value || null
    };
    var problem = !v.d ? 'Needs a description' : !(v.amt > 0) ? 'Needs an amount' : (v.cur === 'EUR' && !(v.rt > 0)) ? 'Needs a rate' : '';
    if (problem) return setStatus(tr, problem, 'err');
    var rate = v.cur === 'EUR' ? v.rt : 1;
    if (v.d === e.description && v.who === e.payer && v.cur === e.currency && Math.abs(v.amt - Number(e.amount)) < 0.005 &&
        Math.abs(rate - Number(e.rate)) < 0.00005 && v.sp === e.split && (v.dt || null) === (e.spent_on || null)) {
      return setStatus(tr, '');
    }
    setStatus(tr, 'Saving…', 'muted');
    rpc('trip_update', { p: key, rid: e.id, d: v.d, who: v.who, cur: v.cur, amt: v.amt, rt: rate, sp: v.sp, dt: v.dt })
      .then(function (r) {
        var nr = Array.isArray(r) ? r[0] : r;
        if (!nr || !nr.id) return refresh();
        for (var i = 0; i < rows.length; i++) if (rows[i].id === nr.id) rows[i] = nr;
        tr.querySelector('.cad').textContent = money(nr.amount_cad);
        setStatus(tr, 'Saved ✓', 'ok');
        setTimeout(function () { var s = tr.querySelector('.st'); if (s && s.textContent === 'Saved ✓') setStatus(tr, ''); }, 2500);
        render(true); tableInfo();
      })
      .catch(function (err) { setStatus(tr, 'Not saved: ' + err.message, 'err'); });
  }
  function deleteRow(id) {
    var e = rows.filter(function (x) { return x.id === id; })[0]; if (!e) return;
    if (!confirm('Delete "' + e.description + '"?')) return;
    rpc('trip_delete', { p: key, rid: id }).then(refresh).catch(function (err) { alert(err.message); });
  }

  $('tbody').addEventListener('input', function (ev) {
    var f = ev.target.dataset.f;
    if (f === 'amount' || f === 'rate') previewRow(ev.target.closest('tr'));
  });
  $('tbody').addEventListener('change', function (ev) {
    var t = ev.target, tr = t.closest('tr'); if (!tr) return;
    if (t.dataset.f === 'currency') {
      var r = field(tr, 'rate');
      if (t.value === 'EUR') { r.disabled = false; if (!(parseFloat(r.value) > 0) && liveRate) r.value = liveRate.toFixed(4); }
      else { r.disabled = true; r.value = ''; }
      previewRow(tr);
    }
    commitRow(tr);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#tbl th[data-sort]'), function (th) {
    th.onclick = function () {
      var k = th.dataset.sort;
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = (k === 'spent_on' || k === 'amount' || k === 'amount_cad') ? -1 : 1; }
      renderTable();
    };
  });
  function onFilter() {
    flt.q = $('fq').value.trim().toLowerCase();
    flt.date = $('fdate').value.trim().toLowerCase();
    flt.desc = $('fdesc').value.trim().toLowerCase();
    flt.payer = $('fpayer').value; flt.split = $('fsplit').value; flt.cur = $('fcur').value;
    renderTable();
  }
  ['fq', 'fdate', 'fdesc'].forEach(function (id) { $(id).oninput = onFilter; });
  ['fpayer', 'fsplit', 'fcur'].forEach(function (id) { $(id).onchange = onFilter; });
  $('fclear').onclick = function () {
    ['fq', 'fdate', 'fdesc', 'fpayer', 'fsplit', 'fcur'].forEach(function (id) { $(id).value = ''; });
    onFilter();
  };

  $('keyGo').onclick = function () {
    var k = $('keyIn').value.trim(); if (!k) return;
    key = k; store('key', k); start();
  };

  // Key arrives via the shared link (#k=...) and is then removed from the address bar.
  (function init() {
    var m = /[#&]k=([^&]+)/.exec(location.hash);
    if (m) { store('key', decodeURIComponent(m[1])); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    key = load('key') || '';
    if (key) start(); else showGate();
  })();
</script>
</body>
</html>
